<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAAC Intake Workflow Demo</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#142033}.top{background:#15212d;color:#fff;padding:16px 26px}.top small{opacity:.72}.wrap{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 75px)}aside{background:#fff;padding:16px;border-right:1px solid #d6dee8}.stage{padding:13px;border:1px solid #d9e0e8;border-radius:11px;margin-bottom:9px;font-weight:700}.stage.active{border:2px solid #2875ea;background:#f4f8ff}.stage.lock{opacity:.45}.status{margin-top:20px;background:#fff3ce;border:1px solid #e7bd39;padding:13px;border-radius:11px;font-weight:bold}main{padding:22px}.card{background:#fff;border:1px solid #d9e0e8;border-radius:16px;padding:22px;max-width:1200px;margin:auto}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}input,textarea,select{width:100%;padding:11px;border:1px solid #ccd5df;border-radius:9px;margin:5px 0 11px}.tile{border:1px solid #d8e0e8;border-radius:12px;padding:15px;cursor:pointer;background:#fff}.tile:hover{border-color:#2875ea;background:#f7faff}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer;margin:5px}.blue{background:#2672df;color:#fff}.green{background:#dff3e6;color:#08742d}.red{background:#ffe2e2;color:#a71919}.amber{background:#fff1c8;color:#7b5700}.vehicleWrap{position:relative;width:360px;height:500px;margin:5px auto;background:#f7f9fb;border:1px solid #dce3eb;border-radius:15px}.vehicle{height:365px;width:180px;background:#dce3ea;border:5px solid #7d8996;border-radius:78px;position:absolute;left:90px;top:55px;cursor:crosshair}.vehicle:before,.vehicle:after{content:"";position:absolute;left:36px;width:98px;height:90px;background:#b9d2e6;border:3px solid #788794;border-radius:27px}.vehicle:before{top:48px}.vehicle:after{bottom:48px}.wheel{position:absolute;background:#3c4650;width:24px;height:75px;border-radius:8px}.w1{left:-18px;top:75px}.w2{right:-18px;top:75px}.w3{left:-18px;bottom:75px}.w4{right:-18px;bottom:75px}.mark{position:absolute;width:29px;height:29px;border-radius:50%;background:var(--mark,#df4c4c);color:#fff;text-align:center;line-height:29px;font-weight:bold;border:2px solid #fff;box-shadow:0 1px 5px #777;transform:translate(-50%,-50%);z-index:4}.legend{font-size:12px;color:#637083;text-align:center}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;padding:3vh}.modal>div{background:#fff;max-width:1100px;margin:auto;border-radius:16px;padding:20px;max-height:94vh;overflow:auto}.thumb{display:inline-block;border:1px solid #d7dfe8;background:#f3f6f9;padding:12px;margin:5px;border-radius:9px;min-width:120px}.finding{border:1px solid #d8e0e8;border-radius:11px;padding:12px;margin:8px 0}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#fff0bf;font-size:12px;font-weight:bold}.mini{font-size:12px;color:#637083}.section{border-top:1px solid #e4e8ed;margin-top:15px;padding-top:15px}.ok{color:#08742d;font-weight:bold}@media(max-width:850px){.wrap{grid-template-columns:1fr}aside{display:none}.grid,.row,.two{grid-template-columns:1fr}.vehicleWrap{width:100%;max-width:360px}}
</style></head><body><header class="top"><small>NEURATEC CORPORATION • FUNCTIONAL PROCESS DEMO</small><h2>S&A Auto Center — Digital Intake & Service Workflow</h2></header><div class="wrap"><aside id="nav"></aside><main><section class="card" id="screen"></section></main></div><div class="modal" id="modal"><div id="modalBody"></div></div><script>
const stages=["Reception + visual","Technical diagnosis","Customer approval","Parts request","Repair / standby","Closeout + QC"], statuses=["VEHICLE ARRIVAL","TECHNICAL DIAGNOSIS","WAITING CUSTOMER APPROVAL","PARTS REQUEST / STANDBY","REPAIR IN PROGRESS","READY / CLOSED"];let step=0,intakeFindings=[],techFindings=[],currentCat="",pendingPoint=null;const catColors={"Exterior":"#e34d59","Interior":"#7b61ff","Tires / Wheels":"#1d7afc","Engine Bay":"#f59e0b","Under Vehicle":"#14a06f","Dashboard":"#d946ef"};
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function nav(){document.querySelector("#nav").innerHTML=stages.map((x,i)=>'<div class="stage '+(i==step?'active':i>step?'lock':'')+'">'+(i+1)+'. '+x+'</div>').join("")+'<div class="status">STATUS: '+statuses[step]+'</div>'}
function next(n){step=n;closeM();nav();render()}
function vehicleHtml(interactive=true){let marks=intakeFindings.filter(f=>f.x!=null).map((f,i)=>'<span class="mark" title="'+esc(f.category)+': '+esc(f.note)+'" style="--mark:'+(catColors[f.category]||"#df4c4c")+';left:'+f.x+'%;top:'+f.y+'%">'+(i+1)+'</span>').join("");return '<div class="vehicleWrap"><div class="vehicle" '+(interactive?'onclick="vehiclePoint(event)"':'')+'><span class="wheel w1"></span><span class="wheel w2"></span><span class="wheel w3"></span><span class="wheel w4"></span>'+marks+'</div><div class="legend">FRONT ↑ &nbsp; • &nbsp; Tap/click directly where damage is found. Add as many points as needed.</div></div>'}
function render(){let s=document.querySelector("#screen");
if(step===0)s.innerHTML='<h2>1. Reception + visual intake</h2><p>Fast check-in: identify pre-existing condition, capture evidence and create the initial service record.</p><div class="row"><label>Customer<input value="Demo Customer"></label><label>Vehicle<input value="2019 Mercedes-Benz GLA250 4Matic"></label><label>VIN<input value="WDC0G4KB0KF123456"></label></div><label>Reason for visit<textarea>Customer reports front noise and requests general inspection.</textarea></label><div class="two"><div><h3>Vehicle condition map</h3>'+vehicleHtml(true)+'</div><div><h3>Quick visual inspection</h3><div class="grid">'+["Exterior","Interior","Tires / Wheels","Engine Bay","Under Vehicle","Dashboard"].map(x=>'<div class="tile" onclick="visualCategory(\''+x+'\')"><b>'+x+'</b><br><small>Open visual check</small></div>').join("")+'</div><div class="section"><h3>Reception findings</h3>'+(intakeFindings.length?intakeFindings.map((f,i)=>'<div class="finding"><b>#'+(i+1)+' '+esc(f.category)+'</b> <span class="pill">'+esc(f.severity)+'</span><br>'+esc(f.note)+'<br><span class="mini">📷 '+f.photos+' photo(s) &nbsp; 🎥 '+f.videos+' video(s)</span></div>').join(""):'<span class="mini">No findings yet. Choose a category or click directly on the vehicle.</span>')+'</div></div></div><button class="btn blue" onclick="completeReception()">Complete reception → Vehicle In</button>';
if(step===1)s.innerHTML='<h2>2. Technical diagnosis & specialized inspection</h2><p>Technical review starts after reception. Every component can carry its own finding, photos and video.</p><div class="grid">'+["Brakes","Engine","Check Engine","Steering","Suspension","Transmission","Electrical","Doors / Body","Tires / Wheels","Cooling","Exhaust","Other"].map(x=>'<div class="tile" onclick="diag(\''+x+'\')"><b>'+x+'</b><br><small>📷 Add photos &nbsp; 🎥 Add video</small></div>').join("")+'</div><div class="section"><h3>Technical findings</h3>'+(techFindings.length?techFindings.map((f,i)=>'<div class="finding"><b>#'+(i+1)+' '+esc(f.category)+'</b> <span class="pill">'+esc(f.severity)+'</span><br>'+esc(f.note)+' — <b>$'+Number(f.estimate).toFixed(2)+'</b><br><span class="mini">📷 '+f.photos+' photo(s) &nbsp; 🎥 '+f.videos+' video(s) • click evidence in customer view</span></div>').join(""):'<span class="mini">No technical findings yet.</span>')+'</div><br><button class="btn blue" onclick="next(2)">Build customer report → Approval</button>';
if(step===2)s.innerHTML='<h2>3. Customer approval</h2><p>Secure-link simulation. The customer sees each diagnosis, evidence and estimate before authorizing work.</p><div class="two"><div><h3>Delivery</h3><button class="btn blue" onclick="alert(\'Demo: secure SMS link sent\')">SMS</button><button class="btn" onclick="alert(\'Demo: WhatsApp link sent\')">WhatsApp</button><button class="btn" onclick="alert(\'Demo: email report sent\')">Email</button><h3>Evidence repository</h3>'+(techFindings.length?techFindings.map((f,i)=>'<div class="thumb" onclick="evidence('+i+')">📷 '+esc(f.category)+'<br><span class="mini">'+f.photos+' photos • '+f.videos+' video</span><br><b>Open evidence</b></div>').join(""):'<div class="thumb">No technical evidence</div>')+'</div><div><h3>Customer decision</h3>'+(techFindings.length?techFindings.map((f,i)=>'<label class="finding"><input id="approve'+i+'" type="checkbox" style="width:auto"> <b>'+esc(f.category)+'</b> — $'+Number(f.estimate).toFixed(2)+'<br><span class="mini">'+esc(f.note)+'</span></label>').join(""):'<div class="finding">No items available for approval.</div>')+'<button class="btn green" onclick="approveAll()">APPROVE ALL</button><button class="btn amber" onclick="approveSelected()">APPROVE SELECTED ONLY</button><button class="btn red" onclick="alert(\'Demo: all work declined; vehicle would move to closeout/no repair.\')">DECLINE ALL</button></div></div>';
if(step===3)s.innerHTML='<h2>4. Parts request & verification</h2><p>Only approved work proceeds. Part number verification is explicit to reduce telephone/order errors.</p><div class="row"><label>Approved job<input value="'+esc((techFindings[0]||{}).category||"Brake repair")+'"></label><label>Part / description<input value="Front brake pad set"></label><label>Part number<input id="partNo" value="VERIFY BEFORE SEND"></label></div><div class="row"><label>Vendor<select><option>Parts Authority</option><option>Worldpac</option></select></label><label>VIN<input value="WDC0G4KB0KF123456"></label><label>Qty<input value="1"></label></div><button class="btn blue" onclick="alert(\'Demo: verified written parts request generated for vendor.\')">Send verified written request</button><button class="btn amber" onclick="alert(\'STATUS: STANDBY FOR PARTS\')">Mark standby for parts</button><button class="btn green" onclick="next(4)">Parts received → Repair</button>';
if(step===4)s.innerHTML='<h2>5. Repair / standby</h2><p>Technician receives only authorized work and sees parts status.</p><div class="finding"><b>Authorized repair</b><br><span class="ok">PARTS RECEIVED</span><br><button class="btn" onclick="alert(\'Demo: completion photo attached\')">📷 Completion photo</button><button class="btn" onclick="alert(\'Demo: completion video attached\')">🎥 Completion video</button></div><button class="btn green" onclick="next(5)">Repair complete → QC</button>';
if(step===5)s.innerHTML='<h2>6. Closeout + QC</h2><div class="finding">✓ Authorized work completed<br>✓ Parts traceability retained<br>✓ Final photos/videos attached<br>✓ Quality-control checkpoint<br>✓ Customer notification ready</div><button class="btn blue" onclick="resetDemo()">Start new vehicle</button>'}
function vehiclePoint(e){const r=e.currentTarget.getBoundingClientRect();pendingPoint={x:((e.clientX-r.left)/r.width*100).toFixed(1),y:((e.clientY-r.top)/r.height*100).toFixed(1)};openVisual(currentCat||"Exterior")}
function visualCategory(c){currentCat=c;pendingPoint=null;openCategoryMap(c)}
function openCategoryMap(c){document.querySelector("#modalBody").innerHTML='<button class="btn" style="float:right" onclick="closeM()">Close</button><h2>'+esc(c)+' — Visual Inspection</h2><p>Tap/click the exact point on the vehicle first. The finding form opens only after a point is selected.</p>'+vehicleHtml(true)+'<div class="legend"><span style="color:'+(catColors[c]||'#df4c4c')+'">●</span> '+esc(c)+' findings use this color.</div>';document.querySelector("#modal").style.display="block"}
function openVisual(c){currentCat=c;modalForm(c,true)}
function diag(c){currentCat=c;modalForm(c,false)}
function modalForm(c,isVisual){document.querySelector("#modalBody").innerHTML='<button class="btn" style="float:right" onclick="closeM()">Close</button><h2>'+esc(c)+'</h2><p>'+(isVisual?'Reception condition / pre-existing damage':'Specialized technical finding')+'</p>'+(isVisual&&pendingPoint?'<p class="ok">Vehicle point selected: '+pendingPoint.x+'% / '+pendingPoint.y+'%</p>':'')+'<div class="two"><div><label>Finding type<select id="ft"><option>Damage / issue</option><option>Scratch</option><option>Dent</option><option>Leak</option><option>Wear</option><option>Warning light</option></select></label><label>Severity<select id="sev"><option>Attention</option><option>Minor</option><option>Critical</option></select></label><label>Quick note / dictation<textarea id="note" placeholder="Describe exactly what was found"></textarea></label><button class="btn" onclick="dictate()">🎙 Dictate note</button></div><div><h3>Evidence</h3><div><button class="btn" onclick="addMedia(\'photo\')">📷 Take / add photo</button><button class="btn" onclick="addMedia(\'video\')">🎥 Record / add video</button></div><div id="mediaCount" class="finding">📷 0 photos &nbsp; 🎥 0 videos</div><label>Recommendation<input id="rec" value="'+(isVisual?'Document condition':'Repair recommended')+'"></label><label>Estimate ($)<input id="est" type="number" value="'+(isVisual?'0':'325')+'"></label></div></div><button class="btn blue" onclick="saveFinding('+isVisual+')">Save finding</button><button class="btn" onclick="saveAndAnother('+isVisual+')">Save + another point/finding</button>';window.media={photos:0,videos:0};document.querySelector("#modal").style.display="block"}
function addMedia(t){if(t==="photo"){if(media.photos>=3)return alert("Reception demo limit: maximum 3 photos per finding.");media.photos++}else{if(media.videos>=2)return alert("Reception demo limit: maximum 2 videos per finding.");media.videos++}document.querySelector("#mediaCount").firstChild.textContent="📷 "+media.photos+" / 3 photos   🎥 "+media.videos+" / 2 videos";let d=document.querySelector("#mediaThumbs");d.innerHTML=Array.from({length:media.photos},(_,i)=>'<span class="thumb">📷 Photo '+(i+1)+'</span>').join('')+Array.from({length:media.videos},(_,i)=>'<span class="thumb">🎥 Video '+(i+1)+'</span>').join('')}
function dictate(){document.querySelector("#note").value="Demo dictated note: visible condition documented for customer review."}
function saveFinding(isVisual,another=false){let f={category:currentCat,type:document.querySelector("#ft").value,severity:document.querySelector("#sev").value,note:document.querySelector("#note").value||"Condition documented",recommendation:document.querySelector("#rec").value,estimate:+document.querySelector("#est").value||0,photos:media.photos,videos:media.videos,x:pendingPoint?pendingPoint.x:null,y:pendingPoint?pendingPoint.y:null};(isVisual?intakeFindings:techFindings).push(f);closeM();render();if(another){setTimeout(()=>{if(isVisual){pendingPoint=null;openVisual(currentCat)}else diag(currentCat)},30)}}
function saveAndAnother(v){if(v){let cat=currentCat;saveFinding(v,false);setTimeout(()=>openCategoryMap(cat),30)}else saveFinding(v,true)}function closeM(){document.querySelector("#modal").style.display="none"}function evidence(i){let f=techFindings[i];alert("Evidence repository demo — "+f.category+"\nPhotos: "+f.photos+"\nVideos: "+f.videos+"\n\nProduction will open full-resolution media from secure storage.")}
function completeReception(){if(!intakeFindings.length)return alert("Register at least one visual finding before completing this demo reception.");next(1)}function approveAll(){techFindings.forEach((_,i)=>{let e=document.querySelector("#approve"+i);if(e)e.checked=true});setTimeout(()=>next(3),250)}function approveSelected(){let n=techFindings.filter((_,i)=>document.querySelector("#approve"+i)?.checked).length;if(!n)return alert("Select at least one repair.");next(3)}function resetDemo(){step=0;intakeFindings=[];techFindings=[];pendingPoint=null;nav();render()}document.querySelector("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeM()});nav();render();
</script></body></html>
