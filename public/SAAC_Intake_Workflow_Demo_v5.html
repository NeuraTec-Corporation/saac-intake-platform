<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAAC Intake Demo</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#142033}.top{background:#15212d;color:white;padding:18px 28px}.top small{opacity:.7}.wrap{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 78px)}aside{background:white;padding:18px;border-right:1px solid #d6dee8}.stage{padding:14px;border:1px solid #d9e0e8;border-radius:12px;margin-bottom:10px;font-weight:700}.stage.active{border:2px solid #2875ea;background:#f4f8ff}.stage.lock{opacity:.45}.status{margin-top:24px;background:#fff3ce;border:1px solid #e7bd39;padding:14px;border-radius:12px;font-weight:bold}main{padding:24px}.card{background:white;border:1px solid #d9e0e8;border-radius:16px;padding:22px;max-width:1100px;margin:auto}.row,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid{grid-template-columns:repeat(4,1fr)}input,textarea,select{width:100%;padding:12px;border:1px solid #ccd5df;border-radius:9px;margin:5px 0 12px}.tile{border:1px solid #d8e0e8;border-radius:12px;padding:16px;cursor:pointer}.tile:hover{border-color:#2875ea}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;margin:5px}.blue{background:#2672df;color:white}.green{background:#dff3e6;color:#08742d}.red{background:#ffe2e2;color:#a71919}.vehicle{height:310px;width:155px;background:#dce3ea;border:5px solid #7d8996;border-radius:70px;margin:20px auto;position:relative}.vehicle:before,.vehicle:after{content:"";position:absolute;left:30px;width:85px;height:80px;background:#b9d2e6;border:3px solid #788794;border-radius:25px}.vehicle:before{top:45px}.vehicle:after{bottom:45px}.mark{position:absolute;width:30px;height:30px;border-radius:50%;background:#e44;color:white;text-align:center;line-height:30px;font-weight:bold;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;padding:4vh}.modal>div{background:white;max-width:1050px;margin:auto;border-radius:16px;padding:20px;max-height:92vh;overflow:auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}.thumb{display:inline-block;background:#edf1f5;padding:18px;margin:5px;border-radius:8px}.hide{display:none}@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{display:none}.grid,.row,.two{grid-template-columns:1fr}}
</style></head><body><header class="top"><small>NEURATEC CORPORATION • CONCEPT DEMO</small><h2>S&A Auto Center — Digital Intake Workflow</h2></header><div class="wrap"><aside id="nav"></aside><main><section class="card" id="screen"></section></main></div><div class="modal" id="modal"><div id="modalBody"></div></div><script>
const stages=["Reception + visual","Technical diagnosis","Customer approval","Parts request","Repair / standby","Closeout + QC"];let step=0,findings=[],photos=[];function nav(){document.querySelector("#nav").innerHTML=stages.map((x,i)=>'<div class="stage '+(i==step?'active':i>step?'lock':'')+'">'+(i+1)+'. '+x+'</div>').join("")+'<div class="status">STATUS: '+["VEHICLE ARRIVAL","TECHNICAL DIAGNOSIS","WAITING CUSTOMER APPROVAL","PARTS REQUEST","REPAIR IN PROGRESS","READY / CLOSED"][step]+'</div>'}function next(n){step=n;nav();render()}function render(){let s=document.querySelector("#screen");if(step==0)s.innerHTML='<h2>1. Reception + visual intake</h2><p>Fast vehicle check-in. Record condition before the vehicle enters the shop.</p><div class="row"><label>Customer<input value="Demo Customer"></label><label>Vehicle<input value="2019 Mercedes-Benz GLA250 4Matic"></label><label>VIN<input value="WDC0G4KB0KF123456"></label></div><label>Reason for visit<textarea>Customer reports front noise and requests general inspection.</textarea></label><div class="two"><div><h3>Visual vehicle condition</h3><p>Tap the vehicle to record exterior/interior intake damage.</p><div class="vehicle" onclick="intake(event)"></div></div><div><h3>Entry evidence</h3><button class="btn">📷 Take photo</button><button class="btn">🎥 Record video</button><h3>Quick inspection</h3><div class="grid">'+["Exterior","Tires / Wheels","Engine Bay","Under Vehicle","Interior","Dashboard"].map(x=>'<div class="tile" onclick="intake(event)"><b>'+x+'</b><br><small>Tap to inspect</small></div>').join("")+'</div></div></div><button class="btn blue" onclick="next(1)">Complete reception → Vehicle In</button>';if(step==1)s.innerHTML='<h2>2. Technical diagnosis & specialized inspection</h2><p>The vehicle is now inside. Each affected component can include its own photo/video evidence.</p><div class="grid">'+["Brakes","Engine","Check Engine","Steering","Suspension","Transmission","Electrical","Doors / Body","Tires / Wheels","Cooling","Exhaust","Other"].map(x=>'<div class="tile" onclick="diag(\''+x+'\')"><b>'+x+'</b><br><small>📷 Photos &nbsp; 🎥 Video</small></div>').join("")+'</div><h3>Findings</h3><div id="findings">'+(findings.length?findings.map((f,i)=>'<div class="tile">#'+(i+1)+' <b>'+f+'</b> — Attention • 📷 evidence • 🎥 video</div>').join(""):'No findings yet.')+'</div><br><button class="btn blue" onclick="next(2)">Send diagnostic to customer</button>';if(step==2)s.innerHTML='<h2>3. Customer approval</h2><p>Customer receives a secure link with findings and media.</p><div class="two"><div><h3>Delivery channel</h3><button class="btn blue">SMS</button><button class="btn">WhatsApp</button><button class="btn">Email</button><h3>Evidence gallery</h3>'+(findings.length?findings.map(f=>'<span class="thumb">📷 '+f+'<br>▶ video</span>').join(""):'<span class="thumb">No media yet</span>')+'</div><div><h3>Customer decision</h3>'+(findings.length?findings.map(f=>'<label><input type="checkbox" style="width:auto"> '+f+' — $325.00</label>').join("<br>"):'Demo diagnostic — $325.00')+'<br><button class="btn green" onclick="next(3)">APPROVE ALL</button><button class="btn">APPROVE SELECTED ONLY</button><button class="btn red">DECLINE ALL</button></div></div>';if(step==3)s.innerHTML='<h2>4. Parts request</h2><p>Only customer-approved work reaches this stage. Confirm exact part codes before ordering.</p><div class="row"><label>Part / description<input value="Front brake pad set"></label><label>Part number<input value="VERIFY BEFORE SEND"></label><label>Vendor<select><option>Parts Authority</option><option>Worldpac</option></select></label></div><button class="btn blue">Send verified request to vendor</button><button class="btn green" onclick="next(4)">Parts received → Repair</button>';if(step==4)s.innerHTML='<h2>5. Repair / standby</h2><p>Technician sees approved work and parts status.</p><div class="tile"><b>Approved repair</b><br>Parts: RECEIVED<br>📷 Add completion photo &nbsp; 🎥 Add completion video</div><button class="btn green" onclick="next(5)">Repair complete → QC</button>';if(step==5)s.innerHTML='<h2>6. Closeout + QC</h2><p>Final evidence, quality check and customer handoff.</p><div class="tile">✓ Approved work completed<br>✓ Final photos/videos attached<br>✓ QC confirmed<br>✓ Customer notification ready</div><button class="btn blue" onclick="next(0)">Start new vehicle</button>'}function intake(){openModal("Visual intake finding",true)}function diag(c){openModal(c+" — Diagnostic finding",false,c)}function openModal(title,visual,c){let m=document.querySelector("#modal"),b=document.querySelector("#modalBody");b.innerHTML='<button class="btn" style="float:right" onclick="closeM()">Close</button><h2>'+title+'</h2>'+(visual?'<div class="two"><div><div class="vehicle"><span class="mark" style="top:110px;right:-15px">1</span></div></div><div>':'')+'<label>Finding type<select><option>Damage / issue</option><option>Scratch</option><option>Leak</option><option>Wear</option></select></label><label>Severity<select><option>Attention</option><option>Minor</option><option>Critical</option></select></label><label>Quick note / dictation<textarea placeholder="Describe finding"></textarea></label><button class="btn">🎙 Dictate note</button><h3>Evidence</h3><button class="btn">📷 Take photo</button><button class="btn">🎥 Record video</button><label>Recommendation<input value="Repair recommended"></label><label>Estimate ($)<input value="325.00"></label><button class="btn blue" onclick="save(\''+(c||"Intake visual")+'\')">Save finding</button>'+(visual?'</div></div>':'');m.style.display="block"}function closeM(){document.querySelector("#modal").style.display="none"}function save(c){findings.push(c);closeM();render()}nav();render();
</script></body></html>
