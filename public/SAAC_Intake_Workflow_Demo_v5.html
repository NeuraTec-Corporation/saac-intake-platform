*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#142033}.top{background:#15212d;color:#fff;padding:16px 26px}.top small{opacity:.72}.wrap{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 75px)}aside{background:#fff;padding:16px;border-right:1px solid #d6dee8}.stage{padding:13px;border:1px solid #d9e0e8;border-radius:11px;margin-bottom:9px;font-weight:700}.stage.active{border:2px solid #2875ea;background:#f4f8ff}.stage.lock{opacity:.45}.status{margin-top:20px;background:#fff3ce;border:1px solid #e7bd39;padding:13px;border-radius:11px;font-weight:bold}main{padding:22px}.card{background:#fff;border:1px solid #d9e0e8;border-radius:16px;padding:22px;max-width:1200px;margin:auto}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}input,textarea,select{width:100%;padding:11px;border:1px solid #ccd5df;border-radius:9px;margin:5px 0 11px}.tile{border:1px solid #d8e0e8;border-radius:12px;padding:15px;cursor:pointer;background:#fff}.tile:hover{border-color:#2875ea;background:#f7faff}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer;margin:5px}.blue{background:#2672df;color:#fff}.green{background:#dff3e6;color:#08742d}.red{background:#ffe2e2;color:#a71919}.amber{background:#fff1c8;color:#7b5700}.vehicleWrap{position:relative;width:360px;height:500px;margin:5px auto;background:#f7f9fb;border:1px solid #dce3eb;border-radius:15px}.vehicle{height:365px;width:180px;background:#dce3ea;border:5px solid #7d8996;border-radius:78px;position:absolute;left:90px;top:55px;cursor:crosshair}.vehicle:before,.vehicle:after{content:"";position:absolute;left:36px;width:98px;height:90px;background:#b9d2e6;border:3px solid #788794;border-radius:27px}.vehicle:before{top:48px}.vehicle:after{bottom:48px}.wheel{position:absolute;background:#3c4650;width:24px;height:75px;border-radius:8px}.w1{left:-18px;top:75px}.w2{right:-18px;top:75px}.w3{left:-18px;bottom:75px}.w4{right:-18px;bottom:75px}.mark{position:absolute;width:29px;height:29px;border-radius:50%;background:var(--mark,#df4c4c);color:#fff;text-align:center;line-height:29px;font-weight:bold;border:2px solid #fff;box-shadow:0 1px 5px #777;transform:translate(-50%,-50%);z-index:4}.legend{font-size:12px;color:#637083;text-align:center}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;padding:3vh}.modal>div{background:#fff;max-width:1100px;margin:auto;border-radius:16px;padding:20px;max-height:94vh;overflow:auto}.thumb{display:inline-block;border:1px solid #d7dfe8;background:#f3f6f9;padding:12px;margin:5px;border-radius:9px;min-width:120px}.finding{border:1px solid #d8e0e8;border-radius:11px;padding:12px;margin:8px 0}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#fff0bf;font-size:12px;font-weight:bold}.mini{font-size:12px;color:#637083}.section{border-top:1px solid #e4e8ed;margin-top:15px;padding-top:15px}.ok{color:#08742d;font-weight:bold}@media(max-width:850px){.wrap{grid-template-columns:1fr}aside{display:none}.grid,.row,.two{grid-template-columns:1fr}.vehicleWrap{width:100%;max-width:360px}}

const stages=["Reception + visual","Technical diagnosis","Customer approval","Parts request","Repair / standby","Closeout + QC"], statuses=["VEHICLE ARRIVAL","TECHNICAL DIAGNOSIS","WAITING CUSTOMER APPROVAL","PARTS REQUEST / STANDBY","REPAIR IN PROGRESS","READY / CLOSED"];let step=0,maxStep=0,intakeFindings=[],techFindings=[],currentCat="",pendingPoint=null;
let customerContact={name:"Demo Customer",mobile:"201-555-0147",whatsapp:"201-555-0147",email:"demo.customer@example.com",preferred:"SMS"};
let approvalState={sent:false,status:"NOT SENT",log:[],decisions:{},followUpMinutes:30,evidence:null};const catColors={"Exterior":"#e34d59","Interior":"#7b61ff","Tires / Wheels":"#1d7afc","Engine Bay":"#f59e0b","Under Vehicle":"#14a06f","Dashboard":"#d946ef"};
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function nav(){document.querySelector("#nav").innerHTML=stages.map((x,i)=>'<div class="stage '+(i==step?'active':i>maxStep?'lock':'')+'" '+(i<=maxStep?'onclick="goStage('+i+')" style="cursor:pointer"':'')+'>'+(i<maxStep?'✓ ':'')+(i+1)+'. '+x+'</div>').join("")+'<div class="status">STATUS: '+statuses[step]+'</div>'}
function goStage(n){if(n>maxStep)return;step=n;closeM();nav();render()}
function next(n){if(n===3&&step===2&&!canProceedApproval())return showSim('<h2>Stage 4 locked</h2><p>Customer authorization evidence is required before Parts Request can open.</p><button class="btn" onclick="closeSim()">Close</button>');maxStep=Math.max(maxStep,n);step=n;closeM();nav();render()}
function vehicleHtml(interactive=true){let marks=intakeFindings.filter(f=>f.x!=null).map((f,i)=>'<span class="mark" title="'+esc(f.category)+': '+esc(f.note)+'" style="--mark:'+(catColors[f.category]||"#df4c4c")+';left:'+f.x+'%;top:'+f.y+'%">'+(i+1)+'</span>').join("");return '<div class="vehicleWrap"><div class="vehicle" '+(interactive?'onclick="vehiclePoint(event)"':'')+'><span class="wheel w1"></span><span class="wheel w2"></span><span class="wheel w3"></span><span class="wheel w4"></span>'+marks+'</div><div class="legend">FRONT ↑ &nbsp; • &nbsp; Tap/click directly where damage is found. Add as many points as needed.</div></div>'}
let findingSort={reception:{key:"id",dir:1},technical:{key:"id",dir:1}};
function sortFindings(kind,key){let s=findingSort[kind];if(s.key===key)s.dir*=-1;else{s.key=key;s.dir=1}render()}
function findingSortValue(f,key,i){if(key==="id")return f.id||i+1;if(key==="category")return (f.category||"").toLowerCase();if(key==="note")return (f.note||"").toLowerCase();if(key==="severity"){let rank={Critical:3,Attention:2,Minor:1};return rank[f.severity]||0}if(key==="evidence")return (Array.isArray(f.photos)?f.photos.length:+f.photos||0)+(Array.isArray(f.videos)?f.videos.length:+f.videos||0);if(key==="estimate")return +f.estimate||0;return ""}
function sortMark(kind,key){let s=findingSort[kind];return s.key===key?(s.dir===1?"▲":"▼"):"↕"}
function findingsTableHtml(kind,items){let s=findingSort[kind],rows=items.map((f,i)=>({f,i})).sort((a,b)=>{let av=findingSortValue(a.f,s.key,a.i),bv=findingSortValue(b.f,s.key,b.i);return (typeof av==="number"&&typeof bv==="number"?av-bv:String(av).localeCompare(String(bv)))*s.dir});let technical=kind==="technical";return '<div class="filterHint">Click any column heading to sort ascending/descending.</div><div class="findingsTableWrap"><table class="findingsTable"><thead><tr><th onclick="sortFindings(\''+kind+'\',\'id\')"># <span class="sortIcon">'+sortMark(kind,"id")+'</span></th><th onclick="sortFindings(\''+kind+'\',\'category\')">'+(technical?"System":"Area")+' <span class="sortIcon">'+sortMark(kind,"category")+'</span></th><th onclick="sortFindings(\''+kind+'\',\'note\')">Finding <span class="sortIcon">'+sortMark(kind,"note")+'</span></th><th onclick="sortFindings(\''+kind+'\',\'severity\')">Severity <span class="sortIcon">'+sortMark(kind,"severity")+'</span></th><th onclick="sortFindings(\''+kind+'\',\'evidence\')">Evidence <span class="sortIcon">'+sortMark(kind,"evidence")+'</span></th>'+(technical?'<th onclick="sortFindings(\''+kind+'\',\'estimate\')">Estimate <span class="sortIcon">'+sortMark(kind,"estimate")+'</span></th>':'')+'<th>Action</th></tr></thead><tbody>'+rows.map(o=>{let f=o.f,i=o.i,p=Array.isArray(f.photos)?f.photos.length:+f.photos||0,v=Array.isArray(f.videos)?f.videos.length:+f.videos||0;return '<tr><td><b>#'+(f.id||i+1)+'</b></td><td><b>'+esc(f.category)+'</b></td><td class="findingText">'+esc(f.note)+'</td><td><span class="pill">'+esc(f.severity)+'</span></td><td class="evidenceCell">📷 '+p+' &nbsp; 🎥 '+v+'</td>'+(technical?'<td class="moneyCell">$'+Number(f.estimate||0).toFixed(2)+'</td>':'')+'<td><button class="btn actionBtn" onclick="viewFinding(\''+kind+'\','+i+')">View</button></td></tr>'}).join("")+'</tbody></table></div>'}
function viewFinding(kind,index){let f=(kind==="technical"?techFindings:intakeFindings)[index];if(!f)return;let p=Array.isArray(f.photos)?f.photos.length:+f.photos||0,v=Array.isArray(f.videos)?f.videos.length:+f.videos||0;alert("#"+(f.id||index+1)+" "+f.category+"\n"+f.severity+"\n"+f.note+"\nPhotos: "+p+" | Videos: "+v+(kind==="technical"?"\nEstimate: $"+Number(f.estimate||0).toFixed(2):""))}
function render(){let s=document.querySelector("#screen");
if(step===0)s.innerHTML='<h2>1. Reception + visual intake</h2><p>Fast check-in: identify pre-existing condition, capture evidence and create the initial service record.</p><div class="row"><label>Customer<input id="custName" value="'+esc(customerContact.name)+'" onchange="syncContact()"></label><label>Vehicle<input value="2019 Mercedes-Benz GLA250 4Matic"></label><label>VIN<input value="WDC0G4KB0KF123456"></label></div><div class="contactGrid"><label>Mobile / SMS<input id="custMobile" value="'+esc(customerContact.mobile)+'" onchange="syncContact()"></label><label>WhatsApp <span class="mini">(enter only if different)</span><input id="custWhatsapp" value="'+esc(customerContact.whatsapp)+'" onchange="syncContact()"></label><label>Email<input id="custEmail" value="'+esc(customerContact.email)+'" onchange="syncContact()"></label><label>Preferred contact<select id="custPreferred" onchange="syncContact()"><option>SMS</option><option>WhatsApp</option><option>Email</option><option>Voice</option></select></label></div><label>Reason for visit<textarea>Customer reports front noise and requests general inspection.</textarea></label><div class="two"><div><h3>Vehicle condition map</h3>'+vehicleHtml(false)+'</div><div><h3>Quick visual inspection</h3><div class="grid">'+["Exterior","Interior","Tires / Wheels","Engine Bay","Under Vehicle","Dashboard"].map(x=>'<div class="tile" onclick="visualCategory(\''+x+'\')"><b>'+x+'</b><br><small>Open visual check</small></div>').join("")+'</div></div></div><div class="section"><h3>Reception findings</h3>'+(intakeFindings.length?findingsTableHtml("reception",intakeFindings):'<span class="mini">No findings yet. Choose a category above.</span>')+'</div><br><button class="btn blue" onclick="completeReception()">Complete reception → Vehicle In</button>';
if(step===1)s.innerHTML='<h2>2. Technical diagnosis & specialized inspection</h2><p>Technical review starts after reception. Every component can carry its own finding, photos and video.</p><div class="grid">'+["Brakes","Engine","Check Engine","Steering","Suspension","Transmission","Electrical","Doors / Body","Tires / Wheels","Cooling","Exhaust","Other"].map(x=>'<div class="tile" onclick="diag(\''+x+'\')"><b>'+x+'</b><br><small>📷 Add photos &nbsp; 🎥 Add video</small></div>').join("")+'</div><div class="section"><h3>Technical findings</h3>'+(techFindings.length?findingsTableHtml("technical",techFindings):'<span class="mini">No technical findings yet.</span>')+'</div><br><button class="btn blue" onclick="next(2)">Build customer report → Approval</button>';
if(step===2)s.innerHTML='<h2>3. Customer approval</h2><p>Send diagnosis, evidence, estimate and expected timing. Customer decision stays locked until a response is received.</p><div class="commPanel"><div><h3>Approval Communication Center</h3><div class="finding"><b>'+esc(customerContact.name)+'</b><br>📱 '+esc(customerContact.mobile)+' &nbsp; • &nbsp; WhatsApp '+esc(customerContact.whatsapp)+'<br>✉️ '+esc(customerContact.email)+'<br><span class="mini">Preferred: '+esc(customerContact.preferred)+'</span></div><div class="deliveryBtns"><button class="btn blue" onclick="sendApproval(\'SMS\')">SMS</button><button class="btn" onclick="sendApproval(\'WhatsApp\')">WhatsApp</button><button class="btn" onclick="sendApproval(\'Email\')">Email</button><button class="btn voiceBtn" onclick="voiceAgent()">☎ Voice Agent</button></div><div class="mini" style="margin-top:8px">Automated status check every 30 minutes while awaiting response — demo simulation.</div></div><div><h3>Communication timeline</h3><div class="approvalStatus '+(approvalState.status==="CUSTOMER RESPONSE RECEIVED"?"ready":"")+'">'+esc(approvalState.status)+'</div><div class="commLog">'+(approvalState.log.length?approvalState.log.map(x=>'<div class="commEntry">'+esc(x)+'</div>').join(""):'<div class="mini">No approval request sent yet.</div>')+'</div><button class="btn" onclick="followUp()">Simulate +30 min follow-up</button><button class="btn" onclick="customerResponse()">Simulate customer response</button></div></div><div class="section '+(approvalState.status==="CUSTOMER RESPONSE RECEIVED"?"":"decisionLocked")+'"><h3>Customer decision '+(approvalState.status==="CUSTOMER RESPONSE RECEIVED"?"":"— awaiting response")+'</h3>'+(techFindings.length?customerDecisionTable():'<div class="finding">No technical findings available for approval.</div>')+'</div>';
if(step===3)s.innerHTML='<h2>4. Parts request & verification</h2><p>Only approved work proceeds. Part number verification is explicit to reduce telephone/order errors.</p><div class="row"><label>Approved job<input value="'+esc((techFindings[0]||{}).category||"Brake repair")+'"></label><label>Part / description<input value="Front brake pad set"></label><label>Part number<input id="partNo" value="VERIFY BEFORE SEND"></label></div><div class="row"><label>Vendor<select><option>Parts Authority</option><option>Worldpac</option></select></label><label>VIN<input value="WDC0G4KB0KF123456"></label><label>Qty<input value="1"></label></div><button class="btn blue" onclick="alert(\'Demo: verified written parts request generated for vendor.\')">Send verified written request</button><button class="btn amber" onclick="alert(\'STATUS: STANDBY FOR PARTS\')">Mark standby for parts</button><button class="btn green" onclick="next(4)">Parts received → Repair</button>';
if(step===4)s.innerHTML='<h2>5. Repair / standby</h2><p>Technician receives only authorized work and sees parts status.</p><div class="finding"><b>Authorized repair</b><br><span class="ok">PARTS RECEIVED</span><br><button class="btn" onclick="alert(\'Demo: completion photo attached\')">📷 Completion photo</button><button class="btn" onclick="alert(\'Demo: completion video attached\')">🎥 Completion video</button></div><button class="btn green" onclick="next(5)">Repair complete → QC</button>';
if(step===5)s.innerHTML='<h2>6. Closeout + QC</h2><div class="finding">✓ Authorized work completed<br>✓ Parts traceability retained<br>✓ Final photos/videos attached<br>✓ Quality-control checkpoint<br>✓ Customer notification ready</div><button class="btn blue" onclick="resetDemo()">Start new vehicle</button>'}
function capturePartReference(input){let f=input.files&&input.files[0];if(!f)return;window.partReferenceImage={name:f.name,url:URL.createObjectURL(f)};let l=document.querySelector("#partRefLabel");if(l)l.textContent=" ✓ "+f.name;input.value=""}
function vehiclePoint(e){if(step!==0)return;const r=e.currentTarget.getBoundingClientRect();pendingPoint={x:+(((e.clientX-r.left)/r.width*100).toFixed(1)),y:+(((e.clientY-r.top)/r.height*100).toFixed(1))};renderVisualWorkspace()}
function visualCategory(c){currentCat=c;pendingPoint=null;window.media={photos:[],videos:[]};openVisualWorkspace(c)}
function categoryFindings(c){return intakeFindings.filter(f=>f.category===c)}
function markerHtml(f,i,pending=false){return '<span class="mark '+(pending?'pendingMark':'')+'" title="'+esc(f.category||currentCat)+'" style="--mark:'+(catColors[f.category||currentCat]||"#df4c4c")+';left:'+f.x+'%;top:'+f.y+'%">'+(pending?intakeFindings.length+1:i+1)+'</span>'}
function workspaceVehicleHtml(){let saved=intakeFindings.filter(f=>f.x!=null).map((f,i)=>markerHtml(f,i)).join("");let pending=pendingPoint?markerHtml({category:currentCat,x:pendingPoint.x,y:pendingPoint.y},0,true):"";return '<div class="vehicleWrap"><div class="vehicle" onclick="vehiclePoint(event)"><span class="wheel w1"></span><span class="wheel w2"></span><span class="wheel w3"></span><span class="wheel w4"></span>'+saved+pending+'</div><div class="legend">FRONT ↑ • Click the exact damage location. Saved points remain visible.</div></div>'}
function openVisualWorkspace(c){currentCat=c;document.querySelector("#modal").style.display="block";renderVisualWorkspace()}
function renderVisualWorkspace(){let ready=!!pendingPoint;let cat=currentCat||"Exterior";let local=categoryFindings(cat);let media=window.media||{photos:[],videos:[]};document.querySelector("#modalBody").innerHTML='<button class="btn" style="float:right" onclick="closeM()">Close</button><h2>'+esc(cat)+' — Visual Inspection</h2><div class="catKey"><span style="color:'+(catColors[cat]||"#df4c4c")+'">● '+esc(cat)+'</span><span>Finding #'+(intakeFindings.length+1)+'</span></div><div class="workspace"><div><div class="workspaceHint">'+(ready?'<b>Point selected.</b> Complete the finding on the right. The numbered marker stays visible while you work.':'<b>Step 1:</b> Click the exact point on the vehicle. The finding form activates only after a point is selected.')+'</div>'+workspaceVehicleHtml()+'<div class="section"><h3>'+esc(cat)+' saved findings</h3>'+(local.length?local.map(f=>'<div class="finding"><b>#'+f.id+' '+esc(f.type)+'</b> <span class="pill">'+esc(f.severity)+'</span><br>'+esc(f.note)+'<br><span class="mini">📷 '+f.photos.length+' photo(s) &nbsp; 🎥 '+f.videos.length+' video(s)</span></div>').join(""):'<span class="mini">No saved findings in this category yet.</span>')+'</div></div><div class="'+(ready?'formReady':'formDisabled')+'"><h3>Finding detail</h3><label>Finding type<select id="ft"><option>Damage / issue</option><option>Scratch</option><option>Dent</option><option>Leak</option><option>Wear</option><option>Warning light</option></select></label><label>Severity<select id="sev"><option>Attention</option><option>Minor</option><option>Critical</option></select></label><label>Quick note / dictation<textarea id="note" placeholder="Describe exactly what was found"></textarea></label><button class="btn" onclick="dictate()">🎙 Dictate note</button><h3>Evidence</h3><input id="photoInput" type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="captureMedia(\'photo\',this)"><input id="videoInput" type="file" accept="video/*" capture="environment" multiple style="display:none" onchange="captureMedia(\'video\',this)"><button class="btn" onclick="document.querySelector(\'#photoInput\').click()">📷 Take / add photo</button><button class="btn" onclick="document.querySelector(\'#videoInput\').click()">🎥 Record / add video</button><div class="finding">📷 '+media.photos.length+' / 3 photos &nbsp; 🎥 '+media.videos.length+' / 2 videos<div class="mediaPreview">'+media.photos.map((x,i)=>'<img src="'+x.url+'" title="Photo '+(i+1)+'">').join("")+media.videos.map((x,i)=>'<video src="'+x.url+'" controls title="Video '+(i+1)+'"></video>').join("")+'</div></div><label>Recommendation<input id="rec" value="Document condition"></label><label>Estimate ($) — not used during Reception<input class="disabledEstimate" value="Not applicable in Reception" disabled></label><div class="workspaceActions"><button class="btn blue" onclick="saveReceptionFinding(false)">Save finding</button><button class="btn" onclick="saveReceptionFinding(true)">Save + another point</button><button class="btn red" onclick="cancelPending()">Cancel point</button></div></div></div>';document.querySelector("#modal").style.display="block"}
function captureMedia(t,input){if(!window.media)window.media={photos:[],videos:[]};let files=[...input.files];let target=t==="photo"?media.photos:media.videos,max=t==="photo"?3:2;for(const f of files){if(target.length>=max)break;target.push({name:f.name,url:URL.createObjectURL(f)})}renderVisualWorkspace()}
function cancelPending(){pendingPoint=null;window.media={photos:[],videos:[]};renderVisualWorkspace()}
function saveReceptionFinding(another){if(!pendingPoint)return alert("Select a point on the vehicle first.");let f={id:intakeFindings.length+1,category:currentCat,type:document.querySelector("#ft").value,severity:document.querySelector("#sev").value,note:document.querySelector("#note").value||"Condition documented",recommendation:document.querySelector("#rec").value||"Document condition",estimate:0,photos:[...(media.photos||[])],videos:[...(media.videos||[])],x:pendingPoint.x,y:pendingPoint.y};intakeFindings.push(f);pendingPoint=null;window.media={photos:[],videos:[]};render();if(another)renderVisualWorkspace();else renderVisualWorkspace()}
function openVisual(c){visualCategory(c)}
function diag(c){currentCat=c;pendingPoint=null;modalForm(c,false)}
function modalForm(c,isVisual){if(isVisual)return visualCategory(c);window.media={photos:[],videos:[]};document.querySelector("#modalBody").innerHTML='<button class="btn" style="float:right" onclick="closeM()">Close</button><h2>'+esc(c)+'</h2><p>Specialized technical finding</p><div class="two"><div><label>Finding type<select id="ft"><option>Damage / issue</option><option>Leak</option><option>Wear</option><option>Warning light</option></select></label><label>Severity<select id="sev"><option>Attention</option><option>Minor</option><option>Critical</option></select></label><label>Quick note / dictation<textarea id="note" placeholder="Describe exactly what was found"></textarea></label><button class="btn" onclick="dictate()">🎙 Dictate note</button></div><div><h3>Evidence</h3><input id="techPhotoInput" type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="techCaptureMedia(\'photo\',this)"><input id="techVideoInput" type="file" accept="video/*" capture="environment" multiple style="display:none" onchange="techCaptureMedia(\'video\',this)"><button class="btn" onclick="document.querySelector(\'#techPhotoInput\').click()">📷 Take / add photo</button><button class="btn" onclick="document.querySelector(\'#techVideoInput\').click()">🎥 Record / add video</button><div id="mediaCount" class="finding">📷 0 / 3 photos &nbsp; 🎥 0 / 2 videos<div id="mediaThumbs" class="mediaPreview"></div></div><label>Recommendation<input id="rec" value="Repair recommended"></label><div class="estimateTools"><label>Estimate ($)<input id="est" type="number" value="325"></label><a class="btn partsBtn" href="https://speeddial.worldpac.com/" target="_blank" rel="noopener noreferrer">Open WORLDpac speedDIAL ↗</a></div><div class="mini">Verify part, availability and pricing in speedDIAL, then return here to enter the customer estimate.</div><div class="availabilityBox"><b>Parts availability & customer timing</b><div class="timeRow"><label>Part availability<select id="partAvailability"><option>In stock / ready now</option><option>Available today</option><option>Next day</option><option>2–3 days</option><option>Backordered / unknown</option></select></label><label>Expected part arrival<div class="timePair"><select id="partEtaHour"><option>08</option><option>09</option><option>10</option><option>11</option><option>12</option><option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option></select><select id="partEtaMin"><option>00 AM</option><option>15 AM</option><option>30 AM</option><option>45 AM</option><option>00 PM</option><option>15 PM</option><option>30 PM</option><option>45 PM</option></select></div></label><label>Estimated vehicle ready<div class="timePair"><select id="readyEtaHour"><option>08</option><option>09</option><option>10</option><option>11</option><option>12</option><option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option></select><select id="readyEtaMin"><option>00 AM</option><option>15 AM</option><option>30 AM</option><option>45 AM</option><option>00 PM</option><option>15 PM</option><option>30 PM</option><option>45 PM</option></select></div></label></div><div class="mini" style="margin-top:8px">Standardized 15-minute scheduling for the customer estimate.</div></div><div class="partIdentity"><b>Exact part identification — required for Parts Request</b><div class="partIdentityGrid"><label>Supplier<select id="partSupplier"><option>WORLDpac</option><option>Parts Authority</option><option>Other</option></select></label><label>Part number / SKU<input id="partNumber" placeholder="Exact supplier/OEM part number"></label><label>Brand / manufacturer<input id="partBrand" placeholder="Bosch / OEM / Denso..."></label><label>Exact description<input id="partDescription" placeholder="e.g. Front brake pad set"></label><label>Section / subsection<input id="partSection" placeholder="Brakes / Front axle"></label><label>Quantity<input id="partQty" type="number" min="1" value="1"></label></div><label>Supplier reference / notes<input id="partReference" placeholder="Catalog reference, warehouse, fitment note..."></label><input id="partRefImage" type="file" accept="image/*" style="display:none" onchange="capturePartReference(this)"><button class="btn" onclick="document.getElementById(&quot;partRefImage&quot;).click()">📷 Attach catalog screenshot / part image</button><span id="partRefLabel" class="mini"> No reference image attached</span></div></div></div><button class="btn blue" onclick="saveFinding(false)">Save finding</button><button class="btn" onclick="saveAndAnother(false)">Save + another finding</button>';document.querySelector("#modal").style.display="block"}
function techCaptureMedia(t,input){if(!window.media||!Array.isArray(media.photos))window.media={photos:[],videos:[]};let files=[...input.files],target=t==="photo"?media.photos:media.videos,max=t==="photo"?3:2;for(const file of files){if(target.length>=max)break;target.push({name:file.name,url:URL.createObjectURL(file)})}renderTechMedia();input.value=""}
function renderTechMedia(){let box=document.querySelector("#mediaCount"),thumbs=document.querySelector("#mediaThumbs");if(!box||!thumbs)return;box.childNodes[0].textContent="📷 "+media.photos.length+" / 3 photos   🎥 "+media.videos.length+" / 2 videos";thumbs.innerHTML=media.photos.map((x,i)=>'<span class="mediaItem"><img src="'+x.url+'" title="Photo '+(i+1)+'"><span class="mediaLabel">Photo '+(i+1)+'</span></span>').join("")+media.videos.map((x,i)=>'<span class="mediaItem"><video src="'+x.url+'" controls title="Video '+(i+1)+'"></video><span class="mediaLabel">Video '+(i+1)+'</span></span>').join("")}
function addMedia(t){document.querySelector(t==="photo"?"#techPhotoInput":"#techVideoInput").click()}
function dictate(){let n=document.querySelector("#note");if(n)n.value="Demo dictated note: visible condition documented for customer review."}
function saveFinding(isVisual,another=false){if(isVisual)return saveReceptionFinding(another);let f={category:currentCat,type:document.querySelector("#ft").value,severity:document.querySelector("#sev").value,note:document.querySelector("#note").value||"Diagnostic finding",recommendation:document.querySelector("#rec").value,estimate:+document.querySelector("#est").value||0,photos:[...(media.photos||[])],videos:[...(media.videos||[])],partAvailability:document.querySelector("#partAvailability")?.value||"Not specified",partEta:(document.querySelector("#partEtaHour")?.value||"")+" "+(document.querySelector("#partEtaMin")?.value||""),readyEta:(document.querySelector("#readyEtaHour")?.value||"")+" "+(document.querySelector("#readyEtaMin")?.value||""),part:{supplier:document.querySelector("#partSupplier")?.value||"",number:document.querySelector("#partNumber")?.value||"",brand:document.querySelector("#partBrand")?.value||"",description:document.querySelector("#partDescription")?.value||"",section:document.querySelector("#partSection")?.value||"",qty:+document.querySelector("#partQty")?.value||1,reference:document.querySelector("#partReference")?.value||"",image:window.partReferenceImage||null},x:null,y:null};techFindings.push(f);closeM();render();if(another)setTimeout(()=>diag(currentCat),30)}
function saveAndAnother(v){if(v)return saveReceptionFinding(true);saveFinding(false,true)}
function closeM(){document.querySelector("#modal").style.display="none"}function syncContact(){customerContact.name=document.querySelector("#custName")?.value||customerContact.name;customerContact.mobile=document.querySelector("#custMobile")?.value||customerContact.mobile;customerContact.whatsapp=document.querySelector("#custWhatsapp")?.value||customerContact.whatsapp;customerContact.email=document.querySelector("#custEmail")?.value||customerContact.email;customerContact.preferred=document.querySelector("#custPreferred")?.value||customerContact.preferred}
function copyMobileToWhatsApp(){syncContact();customerContact.whatsapp=customerContact.mobile;render()}
function contactFor(ch){return ch==="Email"?customerContact.email:ch==="WhatsApp"?customerContact.whatsapp:customerContact.mobile}
function sendApproval(ch){approvalState.sent=true;approvalState.status="AWAITING CUSTOMER RESPONSE";approvalState.log.unshift(new Date().toLocaleTimeString()+" — "+ch+" approval request sent to "+contactFor(ch));render();showSim('<div class="simIcon">✉️</div><h2>Approval request sent</h2><p>Secure review link sent by <b>'+esc(ch)+'</b> to <b>'+esc(contactFor(ch))+'</b>.</p><div class="simStatus">Diagnosis • evidence • estimate • parts availability • vehicle-ready estimate</div><br><button class="btn blue" onclick="closeSim()">Done</button>')}
function followUp(){if(!approvalState.sent)return showSim('<h2>Send the approval request first</h2><button class="btn" onclick="closeSim()">Close</button>');approvalState.log.unshift(new Date().toLocaleTimeString()+" — 30-minute check: no response; reminder/escalation evaluated.");render()}
function voiceAgent(){approvalState.sent=true;approvalState.status="AWAITING CUSTOMER RESPONSE";approvalState.log.unshift(new Date().toLocaleTimeString()+" — Voice Agent call attempted at "+customerContact.mobile);render();showSim('<div class="simIcon">☎</div><h2>Voice Agent simulation</h2><p>Calling '+esc(customerContact.name)+' with estimate and timing context.</p><button class="btn" onclick="closeSim()">Close</button>')}
function customerResponse(){if(!approvalState.sent)return showSim('<h2>No request has been sent</h2><button class="btn" onclick="closeSim()">Close</button>');let stamp=new Date().toLocaleString();techFindings.forEach((_,i)=>approvalState.decisions[i]="Approved");approvalState.status="CUSTOMER RESPONSE RECEIVED";approvalState.evidence={time:stamp,channel:"Secure approval link",reference:"SAAC-"+Date.now().toString().slice(-8),summary:"Customer approved "+techFindings.length+" presented item(s)."};approvalState.log.unshift(stamp+" — CUSTOMER APPROVAL RECEIVED — reference "+approvalState.evidence.reference);render();showSim('<div class="simIcon">✓</div><h2>Customer approval received</h2><p>Authorization evidence has been recorded with timestamp and reference ID.</p><button class="btn blue" onclick="closeSim()">Done</button>')}
function manualDecision(i,v){approvalState.decisions[i]=v;approvalState.log.unshift(new Date().toLocaleString()+" — Manual correction: item #"+(i+1)+" → "+v);render()}
function decisionOptions(d){return ["Pending","Approved","Declined","Needs clarification","Deferred / Suspended"].map(v=>'<option '+(v===d?'selected':'')+'>'+v+'</option>').join("")}
function customerDecisionTable(){let ev=approvalState.evidence?'<div class="evidenceReceipt"><b>✓ Authorization evidence</b><br>Received: '+esc(approvalState.evidence.time)+'<br>Channel: '+esc(approvalState.evidence.channel)+'<br>Reference: <b>'+esc(approvalState.evidence.reference)+'</b><br>'+esc(approvalState.evidence.summary)+'</div>':'';return ev+'<div class="findingsTableWrap"><table class="findingsTable"><thead><tr><th>#</th><th>System</th><th>Finding</th><th>Estimate</th><th>Parts / Ready ETA</th><th>Review</th><th>Customer response</th><th>Manual correction</th></tr></thead><tbody>'+techFindings.map((f,i)=>{let d=approvalState.decisions[i]||"Pending";return '<tr><td><b>#'+(i+1)+'</b></td><td><b>'+esc(f.category)+'</b></td><td>'+esc(f.note)+'</td><td class="moneyCell">$'+Number(f.estimate||0).toFixed(2)+'</td><td><span class="mini">'+esc(f.partAvailability||"Not specified")+'<br>'+esc(f.partEta||"Not specified")+' → '+esc(f.readyEta||"Not specified")+'</span></td><td><button class="btn actionBtn" onclick="reviewCustomerItem('+i+')">Review</button></td><td><b>'+esc(d)+'</b></td><td><select onchange="manualDecision('+i+',this.value)">'+decisionOptions(d)+'</select></td></tr>'}).join("")+'</tbody></table></div><div class="approvalFooter"><span class="mini">Manual correction is audited for phone/in-person exceptions.</span><button class="btn green '+(canProceedApproval()?'':'disabledGate')+'" onclick="continueApprovedWork()">Continue approved work → Parts Request</button></div>'}
function canProceedApproval(){return approvalState.status==="CUSTOMER RESPONSE RECEIVED"&&!!approvalState.evidence&&techFindings.some((_,i)=>approvalState.decisions[i]==="Approved")}
function reviewCustomerItem(i){let f=techFindings[i];showSim('<div class="simIcon">🔎</div><h2>Customer review</h2><p><b>'+esc(f.category)+'</b> — '+esc(f.note)+'</p><h2>$'+Number(f.estimate||0).toFixed(2)+'</h2><p><b>Parts:</b> '+esc(f.partAvailability||"Not specified")+'<br><b>Expected arrival:</b> '+esc(f.partEta||"Not specified")+'<br><b>Vehicle ready:</b> '+esc(f.readyEta||"Not specified")+'</p><button class="btn" onclick="closeSim()">Close</button>')}
function continueApprovedWork(){if(!canProceedApproval())return showSim('<h2>Customer authorization required</h2><p>Parts Request stays locked until customer approval is received and authorization evidence is recorded.</p><button class="btn" onclick="closeSim()">Close</button>');next(3)}
function approvalTableHtml(){return '<div class="findingsTableWrap"><table class="findingsTable"><thead><tr><th>#</th><th>System</th><th>Finding</th><th>Severity</th><th>Evidence</th><th>Estimate</th><th>Review</th><th>Approved</th></tr></thead><tbody>'+techFindings.map((f,i)=>{let p=Array.isArray(f.photos)?f.photos.length:+f.photos||0,v=Array.isArray(f.videos)?f.videos.length:+f.videos||0;return '<tr><td><b>#'+(i+1)+'</b></td><td><b>'+esc(f.category)+'</b></td><td class="findingText">'+esc(f.note)+'</td><td><span class="pill">'+esc(f.severity)+'</span></td><td class="evidenceCell">📷 '+p+' &nbsp; 🎥 '+v+'</td><td class="moneyCell">$'+Number(f.estimate||0).toFixed(2)+'</td><td><button class="btn actionBtn" onclick="reviewEstimate('+i+')">Review estimate</button></td><td style="text-align:center"><input class="approvalCheck" id="approve'+i+'" type="checkbox" aria-label="Approve '+esc(f.category)+'"></td></tr>'}).join("")+'</tbody></table></div><div class="approvalFooter"><label style="display:flex;align-items:center;gap:8px;font-weight:800"><input class="approvalCheck" id="approveAllBox" type="checkbox" onchange="toggleApproveAll(this.checked)"> Approve all items</label><div><button class="btn green" onclick="approveSelected()">Continue with approved work</button><button class="btn red" onclick="declineAll()">Decline all</button></div></div>'}
function simulateSend(channel){showSim('<div class="simIcon">✉️</div><h2>Sending approval request</h2><p>Preparing secure customer review link by <b>'+esc(channel)+'</b>…</p><div class="simStatus">Diagnosis • evidence • estimate</div>');setTimeout(()=>{let b=document.querySelector("#simBody");if(b)b.innerHTML='<div class="simIcon">✓</div><h2>Approval request sent</h2><p>Demo simulation: the customer received a secure link by <b>'+esc(channel)+'</b> to review the estimate and evidence.</p><button class="btn blue" onclick="closeSim()">Done</button>'},650)}
function showSim(html){let d=document.createElement("div");d.id="simOverlay";d.className="simOverlay";d.innerHTML='<div class="simCard" id="simBody">'+html+'</div>';document.body.appendChild(d)}
function closeSim(){document.querySelector("#simOverlay")?.remove()}
function reviewEstimate(i){let f=techFindings[i];if(!f)return;let photos=Array.isArray(f.photos)?f.photos:[],videos=Array.isArray(f.videos)?f.videos:[];showSim('<div class="simIcon">🔎</div><h2>Review estimate</h2><div class="reviewGrid"><div><b>System</b><br>'+esc(f.category)+'</div><div><b>Severity</b><br>'+esc(f.severity)+'</div><div><b>Finding</b><br>'+esc(f.note)+'</div><div><b>Recommendation</b><br>'+esc(f.recommendation||"Repair recommended")+'</div></div><h2>$'+Number(f.estimate||0).toFixed(2)+'</h2><div class="reviewMedia">'+photos.map(x=>'<img src="'+x.url+'" alt="Finding photo">').join("")+videos.map(x=>'<video src="'+x.url+'" controls></video>').join("")+(photos.length+videos.length?"":'<span class="mini">No media attached to this finding.</span>')+'</div><br><button class="btn green" onclick="approveFromReview('+i+')">Approve this item</button> <button class="btn" onclick="closeSim()">Close</button>')}
function approveFromReview(i){let e=document.querySelector("#approve"+i);if(e)e.checked=true;closeSim()}
function toggleApproveAll(v){techFindings.forEach((_,i)=>{let e=document.querySelector("#approve"+i);if(e)e.checked=v})}
function declineAll(){techFindings.forEach((_,i)=>{let e=document.querySelector("#approve"+i);if(e)e.checked=false});showSim('<div class="simIcon">—</div><h2>All work declined</h2><p>Demo simulation: no repair items were authorized.</p><button class="btn" onclick="closeSim()">Close</button>')}
function evidence(i){let f=techFindings[i];alert("Evidence repository demo — "+f.category+"\nPhotos: "+(Array.isArray(f.photos)?f.photos.length:f.photos)+"\nVideos: "+(Array.isArray(f.videos)?f.videos.length:f.videos)+"\n\nProduction will open full-resolution media from secure storage.")}
function completeReception(){if(!intakeFindings.length)return alert("Register at least one visual finding before completing this demo reception.");next(1)}function approveAll(){techFindings.forEach((_,i)=>{let e=document.querySelector("#approve"+i);if(e)e.checked=true});setTimeout(()=>next(3),250)}function approveSelected(){let n=techFindings.filter((_,i)=>document.querySelector("#approve"+i)?.checked).length;if(!n)return showSim('<div class="simIcon">!</div><h2>Select work to approve</h2><p>Review the estimate and check at least one item before continuing.</p><button class="btn" onclick="closeSim()">Close</button>');next(3)}function resetDemo(){step=0;maxStep=0;intakeFindings=[];techFindings=[];pendingPoint=null;window.media={photos:[],videos:[]};approvalState={sent:false,status:"NOT SENT",log:[],decisions:{},followUpMinutes:30,evidence:null};nav();render()}document.querySelector("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeM()});nav();render();
</script></body></html>
